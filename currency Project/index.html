<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/webp" href="rupees.webp">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">
</head>

<body>

    <video autoplay muted loop playsinline class="background-video">
        <source src="currency-bg.mp4" type="video/mp4">
    </video>

    <div class="video-overlay"></div>

    <div class="container">

        <h2>Currency Converter</h2>

        <form>

            <div class="amount">

                <p>Amount:</p>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                >

            </div>

            <div class="dropdown">

                <div class="from">

                    <p>From:</p>

                    <div class="select-container">

                        <img
                            src="https://flagsapi.com/US/flat/64.png"
                            alt="US Flag"
                        >

                        <select name="from">
                        </select>

                    </div>

                </div>

                <i class="fa-solid fa-right-left"></i>


                <div class="to">

                    <p>To:</p>

                    <div class="select-container">

                        <img
                            src="https://flagsapi.com/IN/flat/64.png"
                            alt="India Flag"
                        >

                        <select name="to">
                        </select>

                    </div>

                </div>

            </div>

            <div class="msg">
                1 USD = 95 INR
            </div>

            <button type="submit">
                Get Exchange Rate
            </button>

        </form>

    </div>

    <script src="codes.js"></script>
    <script src="app.js"></script>

</body>

</html>
